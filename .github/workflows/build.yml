name: Descomprimir y compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  build:
    name: Descomprimir ZIP y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar el proyecto (ZIP o carpeta)
        id: proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"
            rm -rf /tmp/proyecto
            mkdir -p /tmp/proyecto
            unzip -q -o "$ZIP" -d /tmp/proyecto
            for i in 1 2 3; do
              find /tmp/proyecto -iname "*.zip" | while read -r Z; do
                unzip -q -o "$Z" -d "$(dirname "$Z")" && rm -f "$Z"
              done
            done
            BASE=/tmp/proyecto
          else
            echo "No hay ZIP, se compila el proyecto que está suelto en el repositorio"
            BASE=$GITHUB_WORKSPACE
          fi
          SETTINGS=$(find "$BASE" -maxdepth 4 -name "settings.gradle*" -not -path "*/build/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no se encontró settings.gradle. Revisá que el ZIP tenga el proyecto de Android completo."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        id: apk
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no se generó el APK"
            exit 1
          fi
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          CODE=$((100 + GITHUB_RUN_NUMBER))
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp "$APK" "$GITHUB_WORKSPACE/salida/SonidoIndependiente-v$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "APK listo: SonidoIndependiente-v$VERSION.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SonidoIndependiente-v${{ steps.apk.outputs.version }}
          path: salida/SonidoIndependiente-v${{ steps.apk.outputs.version }}.apk
          retention-days: 90

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: "Sonido Independiente v${{ steps.apk.outputs.version }}"
          body: |
            APK listo para instalar. Tus datos se conservan al instalar encima de la versión anterior.

            VersionCode: ${{ steps.apk.outputs.code }}
          files: salida/SonidoIndependiente-v${{ steps.apk.outputs.version }}.apk
          make_latest: true
